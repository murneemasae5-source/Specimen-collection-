<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specimen Collection - Digital Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: #121212; 
            color: #FFFFE0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: #1e1e1e; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            overflow: hidden; 
            display: none; 
            border: 1px solid #333;
        }
        .photo-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        .photo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease;
            cursor: zoom-in;
        }
        .photo-container img:hover { transform: scale(1.2); }
        .content { padding: 30px; }
        h1 { 
            color: #000080; 
            font-size: 28px; 
            margin: 0 0 5px 0; 
            font-style: italic; 
        }
        .common-name { 
            color: #EAA221; 
            font-size: 18px; 
            margin-bottom: 25px; 
        }
        .info-group { 
            margin-bottom: 20px; 
            border-left: 2px solid #333; 
            padding-left: 15px; 
        }
        .label { 
            color: #888; 
            font-size: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin: 0;
        }
        .value { 
            color: #FFFFE0; 
            font-size: 16px; 
            margin: 5px 0 0 0; 
        }
        .error { 
            color: #cf6679; 
            text-align: center; 
            font-size: 18px; 
            line-height: 1.6; 
        }
    </style>
</head>
<body>
    <div id="app" class="card">
        <div class="photo-container" id="photo"></div>
        <div class="content">
            <h1 id="scientific_name"></h1>
            <div id="common_name" class="common-name"></div>
            <div class="info-group">
                <p class="label">Specimen ID</p>
                <p id="specimen_id" class="value"></p>
            </div>
            <div class="info-group">
                <p class="label">Taxonomy</p>
                <p id="taxon" class="value"></p>
            </div>
            <div class="info-group">
                <p class="label">Collection Site & Date</p>
                <p id="meta" class="value"></p>
            </div>
            <div class="info-group">
                <p class="label">Preservative</p>
                <p id="preservative" class="value"></p>
            </div>
        </div>
    </div>
    <div id="msg" class="error">🔍 กำลังเปิดฐานข้อมูล...</div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSii-svq-iiIOJcHaM5Kqaj7_dAKshmgwTyq8N1Q7JavdlhAAULOjoXWtw0kQFzAg5d5mCEw7lvorvV/pub?gid=1005317173&single=true&output=csv"; 

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        function safeText(val) {
            return (val && val.toString().trim() !== "") ? val.toString().trim() : "-";
        }

        if (!targetId) {
            document.getElementById('msg').innerText = "❌ กรุณาระบุ ID ของตัวอย่างสัตว์ในลิงก์";
        } else {
            Papa.parse(csvUrl + "&t=" + new Date().getTime(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const cleanTarget = targetId.trim();
                    const item = results.data.find(row => 
                        (row.new_id && row.new_id.trim() === cleanTarget) || 
                        (row.id && row.id.trim() === cleanTarget)
                    );

                    if (item) {
                        document.getElementById('scientific_name').innerText = safeText(item.scientific_name);
                        document.getElementById('common_name').innerText = (item.common_name && item.common_name.trim() !== "") ? item.common_name.trim() : "";
                        document.getElementById('specimen_id').innerText = safeText(item.new_id);
                        document.getElementById('taxon').innerText = `${safeText(item.phylum)} > ${safeText(item.class)} > ${safeText(item.family)}`;
                        document.getElementById('meta').innerText = `${safeText(item.location)} / ${safeText(item.date)}`;
                        document.getElementById('preservative').innerText = safeText(item.preservative);
                        
                        const photoBox = document.getElementById('photo');
                        const imgUrl = item.image_url ? item.image_url.trim() : "";
                        if (imgUrl !== "" && imgUrl !== "-") {
                            photoBox.innerHTML = `<img src="${imgUrl}" alt="Specimen">`;
                            photoBox.style.display = "block";
                        } else {
                            photoBox.style.display = "none";
                        }
                        
                        document.getElementById('app').style.display = "block";
                        document.getElementById('msg').style.display = "none";
                    } else {
                        document.getElementById('msg').innerText = "❌ ไม่พบรหัส: " + targetId;
                    }
                },
                error: function(err) {
                    document.getElementById('msg').innerHTML = "⚠️ ไม่สามารถเชื่อมต่อฐานข้อมูลได้<br><small>กรุณาตรวจสอบการ Publish to web ของ Sheet1</small>";
                }
            });
        }
    </script>
</body>
</html>
