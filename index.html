<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specimen Collection - Digital Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: #1e1e1e; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            overflow: hidden; 
            display: none; 
            border: 1px solid #333;
        }

        .photo-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: #000;
            display: none;
        }

        .photo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease;
            cursor: zoom-in;
        }

        .photo-container img:hover {
            transform: scale(1.2);
        }

        .content { padding: 30px; }

        h1 { 
            color: #bb86fc; 
            font-size: 28px; 
            margin: 0 0 5px 0; 
            font-style: italic;
        }

        .common-name {
            color: #03dac6; 
            font-size: 18px;
            margin-bottom: 25px;
        }

        .info-group {
            margin-bottom: 20px;
            border-left: 2px solid #333;
            padding-left: 15px;
        }

        .label { 
            color: #888; 
            font-size: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .value { 
            color: #e0e0e0; 
            font-size: 16px; 
            margin: 5px 0 0 0;
        }

        .error { color: #cf6679; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <div class="photo-container" id="photo"></div>
        <div class="content">
            <h1 id="scientific_name"></h1>
            <div id="common_name" class="common-name"></div>
            
            <div class="info-group">
                <p class="label">Specimen ID</p>
                <p id="specimen_id" class="value"></p>
            </div>

            <div class="info-group">
                <p class="label">Taxonomy</p>
                <p id="taxon" class="value"></p>
            </div>

            <div class="info-group">
                <p class="label">Collection Site & Date</p>
                <p id="meta" class="value"></p>
            </div>
        </div>
    </div>
    <div id="msg" class="error">🔍 กำลังเปิดฐานข้อมูล...</div>

    <script>
        // ชี้ไปที่แผ่นงาน Copy of Sheet1 (gid=11030081)

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        function safeText(val) {
            return (val && val.toString().trim() !== "") ? val.toString().trim() : "-";
        }

        if (!targetId) {
            document.getElementById('msg').innerText = "❌ กรุณาระบุ ID ของตัวอย่างสัตว์ในลิงก์";
        } else {
            Papa.parse(csvUrl, {
                download: true, 
                header: true,
                skipEmptyLines: true,

                    const cleanTarget = targetId.trim();

                        (row.new_id && row.new_id.trim() === cleanTarget) || 
                        (row.id && row.id.trim() === cleanTarget)
                    );
