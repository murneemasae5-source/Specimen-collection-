<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specimen Collection - Digital Lab (New)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: none; border: 1px solid #333; }
        .photo-container { width: 100%; max-height: 300px; background: #000; overflow: hidden; display: none; }
        .photo-container img { width: 100%; height: 100%; object-fit: contain; }
        .content { padding: 25px; }
        h1 { font-size: 24px; margin: 0 0 10px 0; color: #bb86fc; }
        .specimen-id { font-size: 16px; color: #888; font-family: monospace; margin-bottom: 20px; }
        .info-table { width: 100%; border-collapse: collapse; }
        .info-table th, .info-table td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #333; }
        .info-table th { color: #03dac6; width: 35%; font-size: 14px; }
        .info-table td { color: #e0e0e0; font-size: 15px; }
        #loading { font-size: 18px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="loading">🔍 กำลังดึงข้อมูลอนุกรมวิธาน...</div>

    <div id="app" class="card">
        <div id="photo" class="photo-container"></div>
        <div class="content">
            <h1 id="scientific_name">-</h1>
            <div id="specimen_id" class="specimen-id"></div>
            
            <table class="info-table">
                <tr><th>Phylum</th><td id="phylum">-</td></tr>
                <tr><th>Class</th><td id="class">-</td></tr>
                <tr><th>Order/Family</th><td id="family">-</td></tr>
                <tr><th>Location</th><td id="location">-</td></tr>
                <tr><th>Date</th><td id="date">-</td></tr>
            </table>
        </div>
    </div>

    <script>
        // ลิงก์ฐานข้อมูลแผ่นงานใหม่ล่าสุดของคุณ
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSii-svq-iiIOJcHaM5Kqaj7_dAKshmgwTyq8N1Q7JavdlhAAULOjoXWtw0kQFzAg5d5mCEw7lvorvV/pub?gid=1005317173&single=true&output=csv"; 

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        // ฟังก์ชันช่วยเปลี่ยนช่องที่ไม่มีข้อมูลให้แสดงเครื่องหมาย "-"
        function safeText(val) {
            return (val && val.toString().trim() !== "") ? val.toString().trim() : "-";
        }

        if (!targetId) {
            document.getElementById('loading').innerText = "❌ ไม่พบรหัสไอดีในลิงก์สแกน";
        } else {
            Papa.parse(csvUrl, {
                download: true,
                header: false, // สแกนตำแหน่งคอลัมน์จากซ้ายไปขวาตรงๆ
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        // ค้นหาแถวที่มีค่า ID ตรงกัน (เช่น INV009)
                        let foundRow = results.data.find(row => row[0] && row[0].toString().trim() === targetId.trim());
                        
                        if (foundRow) {
                            // ดึงข้อมูลตามคอลัมน์ (A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8)
                            let pSci = safeText(foundRow[4]); // คอลัมน์ E ชื่อวิทยาศาสตร์
                            let pCommon = safeText(foundRow[5]); // คอลัมน์ F ชื่อเรียกภาษาไทย
                            
                            // แสดงชื่อหลัก: ถ้าไม่มีชื่อวิทยาศาสตร์ จะเอาชื่อเรียกภาษาไทยมาขึ้นแทน
                            if (pSci === "-" && pCommon !== "-") {
                                document.getElementById('scientific_name').innerText = pCommon;
                            } else {
                                document.getElementById('scientific_name').innerText = pSci === "-" ? "ไม่ระบุชื่อวิทยาศาสตร์" : pSci;
                            }

                            document.getElementById('specimen_id').innerText = "ID: " + targetId;
                            document.getElementById('phylum').innerText = safeText(foundRow[1]); // คอลัมน์ B
                            document.getElementById('class').innerText = safeText(foundRow[2]);  // คอลัมน์ C
                            document.getElementById('family').innerText = safeText(foundRow[3]); // คอลัมน์ D
                            document.getElementById('location').innerText = safeText(foundRow[6]); // คอลัมน์ G
                            document.getElementById('date').innerText = safeText(foundRow[7]);     // คอลัมน์ H

                            // ตรวจสอบรูปภาพคอลัมน์ I
                            const photoBox = document.getElementById('photo');
                            let imgUrl = foundRow[8] ? foundRow[8].toString().trim() : "";
                            if (imgUrl !== "" && !imgUrl.includes("blob") && imgUrl !== "-") {
                                photoBox.innerHTML = `<img src="${imgUrl}">`;
                                photoBox.style.display = "block";
                            } else {
                                photoBox.style.display = "none";
                            }

                            // เปิดหน้าการ์ดข้อมูล
                            document.getElementById('app').style.display = "block";
                            document.getElementById('loading').style.display = "none";
                        } else {
                            document.getElementById('loading').innerText = "❌ ไม่พบข้อมูลรหัส " + targetId + " ในระบบตาราง";
                        }
                    } catch (error) {
                        document.getElementById('loading').innerText = "❌ เกิดข้อผิดพลาดในการประมวลผลระบบข้อมูล";
                        console.error(error);
                    }
                },
                error: function() {
                    document.getElementById('loading').innerText = "❌ ไม่สามารถติดต่อฐานข้อมูล Google Sheets ได้";
                }
            });
        }
    </script>
</body>
</html>
