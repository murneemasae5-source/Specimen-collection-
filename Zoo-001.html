<!DOCTYPE html>

    <style>

<body>
    <div class="card">
        <h1>ข้อมูลตัวอย่างสัตว์ดอง (Specimen Data)</h1>

        <p><span class="label">เลขรหัส:</span> SPEC-ANT-001</p>
        <p><span class="label">ชื่อสามัญ:</span> มดตะนอย (Slender Ant)</p>
        <p><span class="label">ชื่อวิทยาศาสตร์:</span> <i>Tetraponera rufonigra</i></p>
